services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    environment:
      - MAX_CONCURRENT_JOBS=1
      - YOLO_MODEL_PATH=/app/output/models/yolov8n.pt
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
